<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калык шынык — Банк покупок PRO</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <svg class="ethno ethno-top" viewBox="0 0 240 120" aria-hidden="true">
    <path d="M0 60 L40 20 L80 60 L120 20 L160 60 L200 20 L240 60" />
  </svg>
  <svg class="ethno ethno-bottom" viewBox="0 0 240 120" aria-hidden="true">
    <path d="M0 60 L40 100 L80 60 L120 100 L160 60 L200 100 L240 60" />
  </svg>

  <header class="topbar glass trapezoid">
    <div class="brand">
      <div class="brand-mark">☀</div>
      <div>
        <h1>Калык шынык</h1>
        <p id="subtitle">Банк покупок</p>
      </div>
    </div>
    <div class="actions">
      <select id="lang"></select>
      <button id="soundBtn" class="btn soft" type="button">🔊</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <aside id="qrPanel" class="overlay hidden">
    <section class="panel glass trapezoid">
      <h3 id="qrTitle"></h3>
      <div id="reader"></div>
      <button id="stopQr" class="btn soft" type="button"></button>
    </section>
  </aside>

  <aside id="modal" class="overlay hidden">
    <section class="panel glass trapezoid">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <button id="modalClose" class="btn primary" type="button">OK</button>
    </section>
  </aside>

  <canvas id="confetti"></canvas>
</body>
</html>
